name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, test, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-

      - name: Restore
        run: dotnet restore Saasy.slnx

      - name: Build
        run: dotnet build Saasy.slnx --no-restore --configuration Release -p:TreatWarningsAsErrors=true

      - name: Test
        run: >
          dotnet test Saasy.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory "${{ github.workspace }}/test-results"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.trx
          if-no-files-found: warn

      - name: Write test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test results
          path: test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Format check
        run: dotnet format Saasy.slnx --verify-no-changes
