<!doctype html>
<html><head><meta charset="utf-8"><title>Type — mono</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-3">
  <div class="row gap-4" style="align-items:baseline">
    <div class="mono-num tabular" style="font-size:32px">1,240,580</div>
    <div class="caption" style="margin-left:auto">JetBrains Mono · 500 · tabular figures</div>
  </div>
  <div class="row gap-4" style="align-items:baseline; border-top:1px solid var(--border-1); padding-top:12px">
    <div class="mono tabular">USD&nbsp;1,240.00</div>
    <div class="mono tabular">80.4%</div>
    <div class="mono">int_4F8a93b2</div>
    <div class="mono">2026-05-08&nbsp;14:32&nbsp;UTC</div>
  </div>
  <div class="row gap-2" style="border-top:1px solid var(--border-1); padding-top:12px">
    <span class="capsule live"><span class="live-dot" style="animation:none"></span>Live</span>
    <span class="capsule warn">⚠&nbsp;80%</span>
    <span class="capsule over">Overage</span>
    <span class="capsule sandbox">Sandbox</span>
    <span class="capsule">Final&nbsp;Close</span>
  </div>
  <div class="caption">Mono labels — UPPERCASE 11 / 14 · 0.06em tracking · 600. Used for state badges + table headers.</div>
</div>
</body></html>
