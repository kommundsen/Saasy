<!doctype html>
<html><head><meta charset="utf-8"><title>Period timeline</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-4">
  <div class="row gap-3" style="align-items:baseline">
    <div class="ui">Billing Period · monthly</div>
    <span class="capsule live" style="margin-left:auto"><span class="live-dot" style="animation:none"></span>In&nbsp;period</span>
  </div>
  <div style="position:relative;height:48px">
    <div style="position:absolute;left:0;right:0;top:22px;height:4px;background:var(--paper-2);border-radius:999px;overflow:hidden">
      <div style="position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--sass-pink)"></div>
    </div>
    <div style="position:absolute;left:0%;top:8px;width:32px;height:32px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center"><span class="mono-label" style="color:var(--ink)">01</span></div>
    <div style="position:absolute;left:62%;top:8px;width:32px;height:32px;border-radius:50%;background:var(--sass-pink);display:flex;align-items:center;justify-content:center;transform:translateX(-50%)"><span class="mono-label" style="color:var(--paper)">NOW</span></div>
    <div style="position:absolute;left:calc(100% - 32px);top:8px;width:32px;height:32px;border-radius:50%;background:var(--paper);border:2px dashed var(--border-3);display:flex;align-items:center;justify-content:center"><span class="mono-label" style="color:var(--fg-3)">31</span></div>
  </div>
  <div class="row gap-3" style="border-top:1px solid var(--border-1); padding-top:10px">
    <div class="col gap-1"><div class="caption">Period start</div><div class="mono tabular">2026-05-01&nbsp;00:00</div></div>
    <div class="col gap-1" style="margin-left:auto;text-align:center"><div class="caption">Period Close</div><div class="mono tabular">2026-05-31&nbsp;00:00&nbsp;Europe/Oslo</div></div>
    <div class="col gap-1" style="margin-left:auto;text-align:right"><div class="caption">Final Close (+24h)</div><div class="mono tabular">2026-06-01&nbsp;00:00</div></div>
  </div>
</div>
</body></html>
