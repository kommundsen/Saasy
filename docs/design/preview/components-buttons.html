<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-4">
  <div class="row gap-3">
    <button class="btn btn-primary">Create Plan Version</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-ghost">View raw Event</button>
    <button class="btn btn-ink">Run Final Close</button>
  </div>
  <div class="row gap-3">
    <button class="btn btn-primary" style="height:28px;padding:0 10px;font-size:12px">Small primary</button>
    <button class="btn btn-secondary" style="height:28px;padding:0 10px;font-size:12px">Small secondary</button>
    <button class="btn btn-primary" style="height:44px;padding:0 18px;font-size:15px">Large CTA</button>
    <button class="btn btn-primary" disabled style="opacity:0.45;cursor:not-allowed">Disabled</button>
  </div>
  <div class="row gap-3" style="border-top:1px solid var(--border-1); padding-top:12px">
    <span class="caption">36px default · 28px dense · 44px CTA. Press = scale(0.98). No scale on hover.</span>
  </div>
</div>
</body></html>
