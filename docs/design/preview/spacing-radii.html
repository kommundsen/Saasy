<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing & radii</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-4">
  <div class="caption">4px base · fibonacci-ish ladder</div>
  <div class="row gap-2" style="align-items:flex-end">
    <div class="col gap-1" style="align-items:center"><div style="width:4px;height:4px;background:var(--ink)"></div><div class="caption">1·4</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:8px;height:8px;background:var(--ink)"></div><div class="caption">2·8</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:12px;height:12px;background:var(--ink)"></div><div class="caption">3·12</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:16px;height:16px;background:var(--ink)"></div><div class="caption">4·16</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:24px;height:24px;background:var(--ink)"></div><div class="caption">5·24</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:32px;height:32px;background:var(--ink)"></div><div class="caption">6·32</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:48px;height:48px;background:var(--ink)"></div><div class="caption">7·48</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:64px;height:64px;background:var(--ink)"></div><div class="caption">8·64</div></div>
  </div>
  <div class="row gap-3" style="border-top:1px solid var(--border-1); padding-top:14px">
    <div class="col gap-1" style="align-items:center"><div style="width:48px;height:48px;background:var(--paper-2);border:1px solid var(--border-2);border-radius:0"></div><div class="caption">none</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:48px;height:48px;background:var(--paper-2);border:1px solid var(--border-2);border-radius:4px"></div><div class="caption">sm·4</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:48px;height:48px;background:var(--paper-2);border:1px solid var(--border-2);border-radius:8px"></div><div class="caption">md·8</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:48px;height:48px;background:var(--paper-2);border:1px solid var(--border-2);border-radius:12px"></div><div class="caption">lg·12</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:48px;height:48px;background:var(--paper-2);border:1px solid var(--border-2);border-radius:20px"></div><div class="caption">xl·20</div></div>
    <div class="col gap-1" style="align-items:center"><div style="width:48px;height:48px;background:var(--paper-2);border:1px solid var(--border-2);border-radius:999px"></div><div class="caption">pill</div></div>
  </div>
</div>
</body></html>
