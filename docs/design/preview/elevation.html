<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-4" style="background:var(--paper-2); border-radius:0">
  <div class="caption">Three-step shadow ladder. Elevation comes from contrast + hairline, not depth.</div>
  <div class="row gap-4">
    <div style="background:var(--paper); border:1px solid var(--border-1); border-radius:12px; padding:18px; flex:1; box-shadow:none">
      <div class="mono-label" style="color:var(--fg-2)">Shadow-0</div>
      <div class="ui" style="margin-top:6px">Flat surface</div>
    </div>
    <div style="background:var(--paper); border:1px solid var(--border-1); border-radius:12px; padding:18px; flex:1; box-shadow:0 1px 0 rgba(14,15,19,0.04), 0 1px 2px rgba(14,15,19,0.04)">
      <div class="mono-label" style="color:var(--fg-2)">Shadow-1</div>
      <div class="ui" style="margin-top:6px">Resting cards</div>
    </div>
    <div style="background:var(--paper); border:1px solid var(--border-1); border-radius:12px; padding:18px; flex:1; box-shadow:0 4px 12px rgba(14,15,19,0.06), 0 2px 4px rgba(14,15,19,0.04)">
      <div class="mono-label" style="color:var(--fg-2)">Shadow-2</div>
      <div class="ui" style="margin-top:6px">Hover, popover</div>
    </div>
    <div style="background:var(--paper); border:1px solid var(--border-1); border-radius:12px; padding:18px; flex:1; box-shadow:0 24px 48px rgba(14,15,19,0.12), 0 8px 16px rgba(14,15,19,0.06)">
      <div class="mono-label" style="color:var(--fg-2)">Shadow-3</div>
      <div class="ui" style="margin-top:6px">Modal, palette</div>
    </div>
  </div>
</div>
</body></html>
