<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-4">
  <div class="caption">Ink → paper. Warm off-white, never pure white.</div>
  <div class="row gap-2">
    <div class="token grow"><div class="swatch" style="background:var(--ink)"></div><div class="label">--ink</div><div class="hex">#0E0F13</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--ink-2)"></div><div class="label">--ink-2</div><div class="hex">#1B1D24</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--ink-3)"></div><div class="label">--ink-3</div><div class="hex">#2B2D35</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--paper-3); border-color:var(--border-1)"></div><div class="label">--paper-3</div><div class="hex">#E8E8E0</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--paper-2); border-color:var(--border-1)"></div><div class="label">--paper-2</div><div class="hex">#F2F2EC</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--paper); border:1px solid var(--border-1)"></div><div class="label">--paper</div><div class="hex">#FAFAF7</div></div>
  </div>
  <div class="row gap-2" style="border-top:1px solid var(--border-1); padding-top:12px">
    <div class="token grow"><div class="swatch" style="background:var(--fg-1); height:36px"></div><div class="label">fg-1 · primary</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--fg-2); height:36px"></div><div class="label">fg-2 · secondary</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--fg-3); height:36px"></div><div class="label">fg-3 · tertiary</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--border-3); height:36px"></div><div class="label">border-3</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--border-2); height:36px"></div><div class="label">border-2</div></div>
    <div class="token grow"><div class="swatch" style="background:var(--border-1); height:36px"></div><div class="label">border-1</div></div>
  </div>
</div>
</body></html>
