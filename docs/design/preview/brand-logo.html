<!doctype html>
<html><head><meta charset="utf-8"><title>Brand</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card-frame col gap-5">
  <div class="row gap-5" style="align-items:flex-end">
    <img src="../assets/logo-wordmark.svg" height="48" alt="Saasy wordmark"/>
    <div class="col gap-1" style="margin-left:auto;text-align:right">
      <div class="caption">Stylized asterisk-meets-clock — counter glyph + punctuation mark.</div>
      <div class="caption">Six tapered ticks, single center dot. Pink on paper.</div>
    </div>
  </div>
  <div class="row gap-3">
    <div style="background:var(--ink); padding:18px 24px; border-radius:12px; flex:1; display:flex; align-items:center; gap:14px">
      <img src="../assets/logo-wordmark-paper.svg" height="36" alt=""/>
    </div>
    <div style="background:var(--paper-2); padding:18px 24px; border-radius:12px; flex:1; display:flex; align-items:center; gap:14px; border:1px solid var(--border-1)">
      <img src="../assets/logo-wordmark-mono.svg" height="36" alt=""/>
    </div>
    <div style="background:var(--sass-pink); padding:18px 24px; border-radius:12px; flex:1; display:flex; align-items:center; gap:14px">
      <img src="../assets/logo-wordmark-paper.svg" height="36" alt=""/>
    </div>
  </div>
</div>
</body></html>
