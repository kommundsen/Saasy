<!doctype html>
<html><head><meta charset="utf-8"><title>Brand pink</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-4">
  <div class="row gap-3">
    <div class="token grow">
      <div class="swatch" style="background:var(--sass-pink-wash)"></div>
      <div class="label">--sass-pink-wash</div><div class="hex">#FFF0F4</div>
    </div>
    <div class="token grow">
      <div class="swatch" style="background:var(--sass-pink-tint)"></div>
      <div class="label">--sass-pink-tint</div><div class="hex">#FFD9E4</div>
    </div>
    <div class="token grow">
      <div class="swatch" style="background:var(--sass-pink); height:88px"></div>
      <div class="label">--sass-pink</div><div class="hex">#FF2D6F · primary</div>
    </div>
    <div class="token grow">
      <div class="swatch" style="background:var(--sass-pink-deep)"></div>
      <div class="label">--sass-pink-deep</div><div class="hex">#D8245C</div>
    </div>
  </div>
  <div class="caption" style="border-top:1px solid var(--border-1); padding-top:12px">
    Brand pink — the only chromatic primary. Used on primary buttons, the brand mark, active selection, and the hero radial wash. Deliberate departure from the blue-dominant metering category.
  </div>
</div>
</body></html>
