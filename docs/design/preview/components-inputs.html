<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs & form</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-3">
  <div class="col gap-1">
    <label class="caption" style="color:var(--fg-1)">Plan name</label>
    <input class="input" value="Pro Annual" style="width:100%"/>
  </div>
  <div class="col gap-1">
    <label class="caption" style="color:var(--fg-1)">Dimension code</label>
    <input class="input mono" value="api_calls" style="width:100%"/>
  </div>
  <div class="row gap-3">
    <div class="col gap-1 grow">
      <label class="caption" style="color:var(--fg-1)">Currency</label>
      <input class="input mono" value="USD" style="width:100%"/>
    </div>
    <div class="col gap-1 grow">
      <label class="caption" style="color:var(--fg-1)">Cycle Anchor</label>
      <input class="input" value="anchor-day" style="width:100%"/>
    </div>
    <div class="col gap-1 grow">
      <label class="caption" style="color:var(--fg-1)">Interval</label>
      <input class="input" value="monthly" style="width:100%"/>
    </div>
  </div>
  <div class="caption">Focus = 2px sass-pink ring + 3px tint halo. Mono input for code-shaped values.</div>
</div>
</body></html>
