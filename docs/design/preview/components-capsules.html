<!doctype html>
<html><head><meta charset="utf-8"><title>Capsules</title>
<link rel="stylesheet" href="_card.css"></head><body>
<div class="card-frame col gap-4">
  <div class="row gap-2" style="flex-wrap:wrap">
    <span class="capsule live"><span class="live-dot" style="animation:none"></span>Live</span>
    <span class="capsule warn">⚠&nbsp;80%</span>
    <span class="capsule over">Overage</span>
    <span class="capsule sandbox">Sandbox</span>
    <span class="capsule info">Pending</span>
    <span class="capsule brand">Selected</span>
    <span class="capsule">Draft</span>
    <span class="capsule">Superseded</span>
    <span class="capsule">Final&nbsp;Close</span>
  </div>
  <div class="row gap-2" style="flex-wrap:wrap; border-top:1px solid var(--border-1); padding-top:12px">
    <span class="capsule"><span class="mono" style="text-transform:none;letter-spacing:0">api_calls</span></span>
    <span class="capsule"><span class="mono" style="text-transform:none;letter-spacing:0">storage_gb</span></span>
    <span class="capsule"><span class="mono" style="text-transform:none;letter-spacing:0">seats</span></span>
    <span class="capsule"><span class="mono" style="text-transform:none;letter-spacing:0">time_weighted_last</span></span>
  </div>
  <div class="caption">Hairline-bordered pills · semantic states use wash + matching ink, never full saturation.</div>
</div>
</body></html>
